name: Docs Site Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  docs-site-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      # Pilot: the setup + task pipeline below (npm ci, pip install, skill
      # extraction, doc regeneration, diagram lint, Docusaurus build) is
      # declared once in ota.yaml at the repo root instead of as bespoke
      # steps here. `ota run docs-build` resolves and runs its full
      # depends_on chain in order; see ota.yaml for the task graph.
      - uses: ota-run/setup@85bf49c11a5aa3ddedfa56c47682cfd40b238f1f # v1.0.9
        with:
          ota-version: v1.6.25

      - name: Run docs pipeline via ota
        run: ota run docs-build --stream
