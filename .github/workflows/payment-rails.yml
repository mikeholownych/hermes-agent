name: Payment Rails

on:
  push:
    branches: [main]
    paths:
      - 'packages/charterforge-stripe-rail/**'
      - 'packages/charterforge-nevermined-rail/**'
      - 'packages/charterforge-circle-rail/**'
      - 'tests/payment_rails/**'
      - '.github/workflows/payment-rails.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/charterforge-stripe-rail/**'
      - 'packages/charterforge-nevermined-rail/**'
      - 'packages/charterforge-circle-rail/**'
      - 'tests/payment_rails/**'
      - '.github/workflows/payment-rails.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rail: [stripe, nevermined, circle]
    
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.8.0"
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Build main charterforge wheel
        run: |
          uv build --wheel --sdist --out-dir dist
          uv build --wheel --sdist --out-dir dist-${{ matrix.rail }} packages/charterforge-${{ matrix.rail }}-rail
      
      - name: Install rail + dependencies
        run: |
          python -m venv /tmp/test-venv
          /tmp/test-venv/bin/pip install dist/charterforge-0.*-py3-none-any.whl
          /tmp/test-venv/bin/pip install dist-${{ matrix.rail }}/charterforge_${{ matrix.rail }}_rail-*-py3-none-any.whl
      
      - name: Verify entry points
        run: |
          /tmp/test-venv/bin/python -c "
          from importlib.metadata import entry_points
          eps = entry_points(group='charterforge.inbound_payment_rails')
          rail_eps = [ep for ep in eps if '${{ matrix.rail }}' in ep.name]
          assert len(rail_eps) >= 1, 'Entry point not found'
          cls = rail_eps[0].load()
          print(f'✓ {cls.__name__} entry point works')
          "
      
      - name: Run integration tests (Stripe only)
        if: matrix.rail == 'stripe'
        run: |
          /tmp/test-venv/bin/pip install pytest httpx
          /tmp/test-venv/bin/python -m pytest -q tests/payment_rails/test_stripe_rail.py

  matrix-complete:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: All rails built successfully
        run: echo "✓ All payment rail packages built and tested"
