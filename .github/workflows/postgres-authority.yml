name: Postgres Authority Store

on:
  push:
    branches: [main]
    paths:
      - 'hermes_cli/postgres_authority.py'
      - 'hermes_cli/authority_store.py'
      - 'tests/test_postgres_authority.py'
      - 'tests/hermes_cli/test_authority_store.py'
      - '.github/workflows/postgres-authority.yml'
  pull_request:
    branches: [main]
    paths:
      - 'hermes_cli/postgres_authority.py'
      - 'hermes_cli/authority_store.py'
      - 'tests/test_postgres_authority.py'
      - 'tests/hermes_cli/test_authority_store.py'
      - '.github/workflows/postgres-authority.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: charterforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.8.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --extra dev --extra postgres

      - name: Run authority store unit tests (no Postgres required)
        run: |
          uv run pytest -v tests/hermes_cli/test_authority_store.py

      - name: Run Postgres authority tests (full adversarial suite)
        env:
          # CI uses the Docker service container with TCP auth.
          AUTHORITY_POSTGRES_TEST_URL: postgresql://test:test@localhost:5432/charterforge_test
        run: |
          uv run pytest -v tests/test_postgres_authority.py

      - name: Verify postgres_authority module API
        run: |
          uv run python -c "
          from hermes_cli.postgres_authority import (
              connect, init_schema, get_schema_version,
              claim_task, reclaim_task, get_claim,
              release_claim, complete_task,
              issue_permit, consume_permit, revoke_permit,
              record_effect, get_effect,
              get_active_runs, cleanup_expired_claims,
              create_tenant, get_tenant, suspend_tenant,
              activate_tenant, check_tenant_claim_quota,
              get_authority_backend, DEFAULT_TENANT_ID, SCHEMA_VERSION
          )
          print(f'✓ postgres_authority module loaded')
          print(f'  Schema version: {SCHEMA_VERSION}')
          print(f'  Default tenant: {DEFAULT_TENANT_ID}')
          print(f'  Backend detection: {get_authority_backend()}')
          "

  build-with-postgres:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.8.0"

      - name: Build with postgres extra
        run: |
          uv build --wheel --sdist
          uv venv --python 3.12
          # The trailing [postgres] extras suffix makes the whole
          # "dist/*.whl[postgres]" argument fail to glob-expand as one word
          # (bash only expands a glob if the ENTIRE word matches a real
          # path; the bracket suffix never does), so bash passes the
          # literal wildcard through to uv, which then fails to parse a
          # version out of the un-expanded "*". Resolve the wheel path on
          # its own first, then append the extras suffix as a plain string.
          WHEEL=$(ls dist/*.whl)
          uv pip install "${WHEEL}[postgres]"

      - name: Verify psycopg installed
        run: |
          uv run --no-project python -c "import psycopg; print(f'✓ psycopg {psycopg.__version__}')"
