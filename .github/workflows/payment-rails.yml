name: Payment Rails

on:
  push:
    branches: [main]
    paths:
      - 'packages/charterforge-stripe-rail/**'
      - 'packages/charterforge-nevermined-rail/**'
      - 'packages/charterforge-circle-rail/**'
      - 'tests/payment_rails/**'
      - '.github/workflows/payment-rails.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/charterforge-stripe-rail/**'
      - 'packages/charterforge-nevermined-rail/**'
      - 'packages/charterforge-circle-rail/**'
      - 'tests/payment_rails/**'
      - '.github/workflows/payment-rails.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rail: [stripe, nevermined, circle]
    
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.8.0"
      
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: "3.12"

      # Pilot: the build/install/verify pipeline below is declared once in
      # ota.yaml at the repo root as build-main-wheel -> build-rail-<name> ->
      # (stripe only) test-stripe-integration. `ota run` resolves and runs
      # the full depends_on chain in order; see ota.yaml for the task graph.
      - uses: ota-run/setup@85bf49c11a5aa3ddedfa56c47682cfd40b238f1f # v1.0.9
        with:
          ota-version: v1.6.25

      - name: Build + install + verify rail via ota
        run: |
          if [ "${{ matrix.rail }}" = "stripe" ]; then
            ota run test-stripe-integration --stream
          else
            ota run build-rail-${{ matrix.rail }} --stream
          fi

  matrix-complete:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: All rails built successfully
        run: echo "✓ All payment rail packages built and tested"
